# OTA publish on every push to main via EAS Update.
# REQUIRES: EXPO_TOKEN must be set in GitHub repo secrets (Settings > Secrets
# and variables > Actions). Until it is, this workflow will fail — expected.
name: EAS Update

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        run: eas update --branch preview --message "$GITHUB_SHA"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
